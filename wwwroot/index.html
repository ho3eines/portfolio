<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta name="description" content="Mahbod Pour — Frontend Developer &amp; UI/UX Enthusiast based in Frankfurt. Crafting digital experiences with Blazor, .NET, and modern web technologies." />
    <meta name="keywords" content="Mahbod Pour, frontend developer, Blazor, .NET, web developer Frankfurt, UI/UX, ASP.NET Core, C#" />
    <meta name="author" content="Mahbod Pour" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://mahbodpour.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mahbod Pour — Frontend Developer &amp; UI/UX Enthusiast" />
    <meta property="og:description" content="Crafting Digital Experiences That Inspire." />
    <meta property="og:image" content="/images/icon-512.png" />
    <meta property="og:url" content="https://mahbodpour.com/" />
    <meta property="og:site_name" content="Mahbod Pour Portfolio" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mahbod Pour — Frontend Developer &amp; UI/UX Enthusiast" />
    <meta name="twitter:description" content="Crafting Digital Experiences That Inspire." />
    <meta name="twitter:image" content="/images/icon-512.png" />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mahbod Pour" />

    <!-- PWA Manifest + Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/icon-192.png" />
    <meta name="msapplication-TileImage" content="/images/icon-192.png" />
    <meta name="msapplication-TileColor" content="#0a0a0a" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />

    <style>
        /* Blazor loading state — matches site theme */
        #blazor-loading {
            position: fixed; inset: 0; z-index: 2000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            background: #0b0d10;
        }
        .blazor-spinner {
            width: 52px; height: 52px;
            border: 3px solid rgba(201,169,106,0.15);
            border-top-color: #c9a96a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .blazor-loading-text {
            font-family: 'Inter', sans-serif;
            font-size: 12px; letter-spacing: 0.3em;
            text-transform: uppercase; color: #6c747f;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Blazor WASM mounts here -->
    <div id="app">
        <div id="blazor-loading">
            <div class="blazor-spinner"></div>
            <div class="blazor-loading-text">Loading…</div>
        </div>
    </div>

    <!-- Animations engine — re-bindable, called by Blazor after render -->
    <script src="js/animations.js"></script>

    <!-- PWA — Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((reg) => console.log('⚡ PWA: SW registered —', reg.scope))
                    .catch((err) => console.log('PWA: SW failed —', err));
            });
        }
    </script>

    <!-- Blazor WASM framework — auto-generated by build -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
