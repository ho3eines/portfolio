<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Select Language — Mahbod Pour</title>
<meta name="theme-color" content="#080e19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Manrope',sans-serif;background:#080e19;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .gate{text-align:center;padding:48px 24px;max-width:420px;animation:fadeIn 0.7s ease}
  @keyframes fadeIn{0%{opacity:0;transform:translateY(30px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
  .gate-icon{position:relative;width:100px;height:100px;margin:0 auto 8px}
  .gate-icon svg{width:100%;height:100%;animation:spin 12s linear infinite;opacity:.3}
  .gate-icon span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;animation:float 3s ease-in-out infinite}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .gate h1{font-family:'DM Serif Display',Georgia,serif;font-size:1.9rem;font-weight:400;letter-spacing:-.03em;margin:0 0 8px}
  .gate p{color:#9aaac0;font-size:.88rem;margin:0 0 24px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;background:#111c2e;border:1px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;color:#fff;font:inherit;text-align:left;transition:all .3s ease}
  .opt:hover{border-color:#f0b45e;background:#111c2e;transform:translateX(4px)}
  .opt:active{transform:scale(.98)}
  .opt .flag{font-size:1.8rem;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border-radius:12px;flex-shrink:0}
  .opt .info{flex:1;display:flex;flex-direction:column;gap:2px}
  .opt .info strong{font-size:.95rem;font-weight:600}
  .opt .info small{font-size:.75rem;color:#9aaac0}
  .opt .arr{color:#9aaac0;transition:all .3s ease;flex-shrink:0}
  .opt:hover .arr{color:#f0b45e;transform:translateX(4px)}
  .opt-fa{font-family:'Vazirmatn','Tahoma',sans-serif}
  .opt-fa strong{font-family:'Vazirmatn','Tahoma',sans-serif;font-weight:700;font-size:1rem}
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;color:#f0b45e;font-size:.85rem;margin-top:12px;display:none}
  .loading.show{display:flex}
  .spinner{width:20px;height:20px;border:2px solid rgba(212,160,76,.2);border-top-color:#f0b45e;border-radius:50%;animation:spin .7s linear infinite}
  @media(min-width:481px){.gate h1{font-size:2rem}}
  @media(max-width:480px){.gate{padding:32px 16px}.gate-icon{width:80px;height:80px}.opt{padding:14px 16px;gap:10px}.opt .flag{width:40px;height:40px;font-size:1.4rem}}
</style>
</head>
<body>
<div class="gate">
  <div class="gate-icon">
    <svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" stroke="#f0b45e" stroke-width="2" stroke-dasharray="10 5"/></svg>
    <span>🌐</span>
  </div>
  <h1>Choose Your Language</h1>
  <p>Select your preferred language to continue</p>
  <div class="opts">
    <button class="opt" onclick="selectLang('en')">
      <span class="flag">🇬🇧</span>
      <div class="info"><strong>English</strong><small>United States · English</small></div>
      <svg class="arr" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 5l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="opt opt-fa" onclick="selectLang('fa')">
      <span class="flag">🇮🇷</span>
      <div class="info"><strong>فارسی</strong><small>Iran · Persian</small></div>
      <svg class="arr" width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 5l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><span>Loading...</span></div>
</div>
<script>
  window.selectLang = function(lang) {
    document.getElementById('loading').classList.add('show');
    document.querySelectorAll('.opt').forEach(function(o){o.style.pointerEvents='none';o.style.opacity='0.4';});
    localStorage.setItem('lang', lang);
    setTimeout(function(){ window.location.replace('/'); }, 600);
  };
</script>
</body>
</html>
